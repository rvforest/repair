# Dependabot version updates: one grouped PR per ecosystem per month.
# The 7-day cooldown skips releases younger than a week (supply-chain hygiene;
# zizmor's dependabot-cooldown audit checks for it).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
